# Пинг против засыпания Supabase.
#
# Бесплатный проект паузится после недели без обращений к API и будится
# только руками из панели. Один вызов public.ping() в сутки — настоящий
# запрос в базу, этого достаточно.
#
# Почему не корень /rest/v1/: он отдаётся только секретному ключу, а класть
# секретный ключ в GitHub незачем. ping() выдана роли anon миграцией 011 и
# ничего не читает.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  sb_publishable_… или legacy anon (eyJ…) — оба публичные
#
# Оговорка GitHub: в репозитории без коммитов 60 дней расписания
# отключаются автоматически, приходит письмо. Включить обратно — кнопкой
# на вкладке Actions. Любой коммит сбрасывает счётчик.

name: keepalive

on:
  schedule:
    - cron: "17 6 * * *"   # ежедневно 06:17 UTC; минута не 0, чтобы не толкаться в очереди
  workflow_dispatch:        # ручной запуск для проверки

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST /rest/v1/rpc/ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "не заданы SUPABASE_URL / SUPABASE_ANON_KEY в secrets" >&2
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST -H "content-type: application/json" -d '{}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/rpc/ping")
          echo "HTTP $code $(cat "$body")"
          case "$code" in
            2*) ;;
            401) echo "ключ отвергнут — проверь SUPABASE_ANON_KEY" >&2; exit 1 ;;
            404) echo "нет функции public.ping() — примени db/011_ping.sql" >&2; exit 1 ;;
            *) echo "проект не ответил — возможно, уже на паузе" >&2; exit 1 ;;
          esac
